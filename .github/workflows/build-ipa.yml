name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project LocalAIStudio.xcodeproj -scheme LocalAIStudio \
            -configuration Release \
            -resolvePackageDependencies

      - name: Build (unsigned, device)
        run: |
          xcodebuild -project LocalAIStudio.xcodeproj -scheme LocalAIStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAIStudio.app Payload/
          zip -qr LocalAIStudio.ipa Payload
          echo "IPA size:" && ls -lh LocalAIStudio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-ipa
          path: LocalAIStudio.ipa
          if-no-files-found: error
